name: mesflow-gateway

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: mesflow-nginx
    restart: unless-stopped
    environment:
      TZ: ${MESFLOW_TIMEZONE:-Asia/Ho_Chi_Minh}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/mesflow/certs:/etc/nginx/certs:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge:
    name: mesflow-edge
    external: true
