name: mesflow-test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesflow_test
      POSTGRES_USER: mesflow_test
      POSTGRES_PASSWORD: mesflow_test_password
      TZ: Asia/Ho_Chi_Minh
      PGTZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesflow_test -d mesflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Same Gate 17 fix as compose.yml -- this stack routinely stays up for
    # hours across a long test session (this one included), so an
    # unbounded default json-file log is a real, not just theoretical, risk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mesflow-test-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MESFLOW_ENV: test
      DATABASE_URL: postgresql://mesflow_test:mesflow_test_password@postgres-test:5432/mesflow_test
      WORKSHOP_DATABASE_URL: postgresql://mesflow_test:mesflow_test_password@postgres-test:5432/mesflow_test
      MESFLOW_SECRET_KEY: mesflow-test-secret-key
      WORKSHOP_COOKIE_SECURE: "0"
      MESFLOW_TEST_AUTO_LOGIN: "1"
      MESFLOW_TEST_AUTO_LOGIN_USERNAME: admin
      MESFLOW_ADMIN_USERNAME: admin
      MESFLOW_ADMIN_PASSWORD: Admin@123456
      # Fix Plan Phase 10: legacy ESP32 kiosk auto-bind-on-first-contact
      # now defaults OFF for production safety (core/config.py). The
      # existing pre-Phase-10 integration test suite exercises the legacy
      # v1 kiosk flow (/station/heartbeat, /session/group/*, offline-sync)
      # against ad-hoc, never-explicitly-registered device_uuids -- same
      # reasoning as MESFLOW_TEST_AUTO_LOGIN=1 above (a real permissive
      # opt-in for THIS test environment only, never set in compose.yml/
      # compose.local-test.yml -- PROD-TEST/production's own .env are
      # deploy targets outside this repo, deliberately not touched here).
      MESFLOW_ALLOW_LEGACY_KIOSK_AUTOBIND: "1"
      MESFLOW_TIMEZONE: Asia/Ho_Chi_Minh
      MESFLOW_ENABLE_FORCE_DELETE_PO: "1"
      MESFLOW_DEPLOYMENT_ID: docker-e2e
      MESFLOW_ESP_TUTORIAL_DIR: /data/tutorials/esp-kiosk
      MESFLOW_INTERNAL_API_TOKEN: ${MESFLOW_INTERNAL_API_TOKEN:-local-internal-readiness-token}
      # Monitoring ownership cutover (reports/SYSTEM_LOG_AUDIT_SEPARATION.md):
      # off by default in real deployments -- kept on here so the existing
      # V69/Phase2/Phase3 test suite still exercises the underlying write
      # mechanism (proves it isn't rotted for a future rollback) without
      # requiring every test file to flip it on itself.
      MESFLOW_LEGACY_HEALTH_WRITER_ENABLED: "1"
    volumes:
      - ./runtime/tutorials:/data/tutorials:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/system/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      MESFLOW_ENV: test
      MESFLOW_SECRET_KEY: mesflow-test-secret-key
      MESFLOW_TEST_AUTO_LOGIN: "1"
      MESFLOW_TEST_AUTO_LOGIN_USERNAME: admin
      MESFLOW_ADMIN_USERNAME: admin
      MESFLOW_ADMIN_PASSWORD: Admin@123456
      WORKSHOP_COOKIE_SECURE: "0"
      MESFLOW_DEPLOYMENT_ID: docker-tests
      DATABASE_URL: postgresql://mesflow_test:mesflow_test_password@postgres-test:5432/mesflow_test
      WORKSHOP_DATABASE_URL: postgresql://mesflow_test:mesflow_test_password@postgres-test:5432/mesflow_test
      MESFLOW_BASE_URL: http://mesflow-test-api:8080
      MESFLOW_TEST_USERNAME: admin
      MESFLOW_TEST_PASSWORD: Admin@123456
      MESFLOW_TIMEZONE: Asia/Ho_Chi_Minh
      MESFLOW_ENABLE_FORCE_DELETE_PO: "1"
      PYTEST_ADDOPTS: --strict-markers
    depends_on:
      mesflow-test-api:
        condition: service_healthy
    volumes:
      - ./test-results:/workspace/test-results

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      MESFLOW_BASE_URL: http://mesflow-test-api:8080
    depends_on:
      mesflow-test-api:
        condition: service_healthy
    volumes:
      - ./test-results:/workspace/test-results
