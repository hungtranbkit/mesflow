services:
  postgres:
    image: postgres:17-alpine
    container_name: mesflow-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mesflow}
      POSTGRES_USER: ${POSTGRES_USER:-mesflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${MESFLOW_TIMEZONE:-Asia/Ho_Chi_Minh}
      PGTZ: UTC
    volumes:
      - ./runtime/postgres-v65:/var/lib/postgresql/data
      - ./runtime/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesflow} -d ${POSTGRES_DB:-mesflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    # Reliability Validation Round 2, Gate 17 (2026-08-26): confirmed live
    # this host's Docker daemon has no /etc/docker/daemon.json and no
    # per-service logging block anywhere in this file -- meaning the
    # default json-file driver's container stdout/stderr log had NO size
    # cap at all, growing unbounded for the lifetime of the container.
    # Bounded explicitly here rather than relying on (or changing) the
    # host-wide daemon default, which is out of this repo's scope.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mesflow:
    # Transitional source-ZIP fallback. Image releases always deploy with
    # --no-build and an immutable MESFLOW_IMAGE=image@digest.
    build:
      context: .
    image: ${MESFLOW_IMAGE:-mesflow-app:71.0.0.71}
    container_name: mesflow-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MESFLOW_ENV: production
      MESFLOW_SECRET_KEY: ${MESFLOW_SECRET_KEY:?MESFLOW_SECRET_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKSHOP_DATABASE_URL: ${WORKSHOP_DATABASE_URL:-${DATABASE_URL}}
      WORKSHOP_COOKIE_SECURE: "1"
      MESFLOW_TRUSTED_PROXY_COUNT: "1"
      MESFLOW_ENABLE_FORCE_DELETE_PO: ${MESFLOW_ENABLE_FORCE_DELETE_PO:-0}
      MESFLOW_TIMEZONE: ${MESFLOW_TIMEZONE:-Asia/Ho_Chi_Minh}
      MESFLOW_TEST_AUTO_LOGIN: ${MESFLOW_TEST_AUTO_LOGIN:-0}
      MESFLOW_TEST_AUTO_LOGIN_USERNAME: ${MESFLOW_TEST_AUTO_LOGIN_USERNAME:-admin}
      MESFLOW_LOCAL_AUTO_LOGIN: ${MESFLOW_LOCAL_AUTO_LOGIN:-0}
      MESFLOW_INTERNAL_QA_AUTO_LOGIN: ${MESFLOW_INTERNAL_QA_AUTO_LOGIN:-0}
      MESFLOW_INTERNAL_HTTP_SESSION: ${MESFLOW_INTERNAL_HTTP_SESSION:-1}
      MESFLOW_TUTORIAL_DIR: /data/tutorials
      MESFLOW_INTERNAL_API_TOKEN: ${MESFLOW_INTERNAL_API_TOKEN:-}
      MESFLOW_LOG_RETENTION_ENABLED: ${MESFLOW_LOG_RETENTION_ENABLED:-1}
      MESFLOW_LOG_RETENTION_BATCH_SIZE: ${MESFLOW_LOG_RETENTION_BATCH_SIZE:-2000}
      MESFLOW_LOG_RETENTION_SUCCESS_DAYS: ${MESFLOW_LOG_RETENTION_SUCCESS_DAYS:-30}
      MESFLOW_LOG_RETENTION_SLOW_DAYS: ${MESFLOW_LOG_RETENTION_SLOW_DAYS:-90}
      MESFLOW_LOG_RETENTION_RESOLVED_ERROR_DAYS: ${MESFLOW_LOG_RETENTION_RESOLVED_ERROR_DAYS:-180}
      MESFLOW_LOG_RETENTION_UNRESOLVED_ERROR_DAYS: ${MESFLOW_LOG_RETENTION_UNRESOLVED_ERROR_DAYS:-365}
      MESFLOW_LOG_RETENTION_SECURITY_DAYS: ${MESFLOW_LOG_RETENTION_SECURITY_DAYS:-365}
      MESFLOW_LOG_RETENTION_ERROR_TRACE_RESOLVED_DAYS: ${MESFLOW_LOG_RETENTION_ERROR_TRACE_RESOLVED_DAYS:-180}
      MESFLOW_LOG_RETENTION_ERROR_TRACE_UNRESOLVED_DAYS: ${MESFLOW_LOG_RETENTION_ERROR_TRACE_UNRESOLVED_DAYS:-365}
      TZ: ${MESFLOW_TIMEZONE:-Asia/Ho_Chi_Minh}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime/uploads:/data/uploads
      - ./runtime/backups:/data/backups
      - ./runtime/tutorials:/data/tutorials:ro
      - ./runtime/firmware:/data/firmware
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/system/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      default: {}
      edge:
        aliases:
          - mesflow-app

networks:
  default:
    name: mesflow_network
  edge:
    name: mesflow-edge
    external: true
