name: PostgreSQL Docker Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run full PostgreSQL/Docker suite
        run: ./scripts/test/docker-test.sh
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesflow-test-results
          path: test-results/*.xml
          if-no-files-found: warn
