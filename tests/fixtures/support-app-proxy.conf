# Mirror the TEST edge: public support is isolated from app sessions and APIs.
server {
    listen 8080;
    location /support/ {
        proxy_pass http://public-support-test:8088;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
    }
    location / {
        proxy_pass http://mesflow-test-api:8080;
        proxy_set_header Host $http_host;
    }
}
