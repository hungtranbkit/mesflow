<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMEX v{{ version }}</title>
  <link rel="stylesheet" href="/static/ui.css?v={{ version }}">
</head>
<body class="admin-body">
  <!-- THESIS: MESFlow is a workshop dispatch desk, not a SaaS dashboard. OWN-WORLD: command navy shell, neutral work surfaces, compact Swiss typography, precise rules, semantic status only. STORY: operators see exceptions, understand production state, then act without hunting. FIRST VIEWPORT: persistent navigation, compact context header, dense operational workspace, primary action in context. FORM: industrial operations console; seed mesflow-industrial-console. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
  <a class="skip-link" href="#content">Bỏ qua điều hướng</a>
  <div class="app-layout" id="appLayout">
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">MF</div>
        <div class="sidebar-brand-text"><b>KIMEX</b><small>v{{ version }}</small></div>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Thu gọn menu" title="Thu gọn / mở rộng menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <nav id="nav" class="sidebar-nav"></nav>
      <div class="sidebar-account">
        <div class="sidebar-user"><b>{{ username }}</b><small>{{ role }}</small><span class="sidebar-db-state" title="Cơ sở dữ liệu"><i></i>Database</span></div>
        <button id="logout" type="button">Đăng xuất</button>
      </div>
    </aside>
    <div class="app-workspace">
      <header class="admin-header workspace-header">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Mở menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="legacy-brand">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Tổng quan hoạt động sản xuất</p>
        </div>
        <span class="badge badge-muted" id="aiTestLabel" title="Read-only test marker">AI LOOP TEST</span>
      </header>
      <main class="admin-page workspace-main"><section id="content"></section></main>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>window.MESFLOW_USER={{ {'id':session_user_id,'username':username,'role':role,'permissions':permissions}|tojson }};</script>
  <script src="/static/core/api.js?v={{ version }}"></script>
  <script src="/static/core/nav.js?v={{ version }}"></script>
  <script src="/static/core/ui.js?v={{ version }}"></script>
  <script src="/static/pages/session-detail.js?v={{ version }}"></script>
  <script src="/static/app.js?v={{ version }}"></script>
  <script src="/static/pages/overview.js?v={{ version }}"></script>
  <!-- pages/session-exceptions.js is NOT loaded here on purpose: it defines
       its own renderSessionExceptions(), but exception-center.js (below)
       always loads after it and unconditionally overwrites that same
       global (`renderSessionExceptions=ExceptionCenter.render`), so the
       session-exceptions.js implementation never actually ran in the
       browser -- confirmed live via Playwright (the rendered Exception
       Center page matches exception-center.js's 5-tab UI, not
       session-exceptions.js's 3-tab UI). Loading a script that can never
       take effect is dead weight, not a harmless fallback; removed. If
       session-exceptions.js's richer per-session workflow/classification
       UI is meant to replace exception-center.js, that is a real product
       decision (backend parity with /api/exceptions' reconciliation needs
       verifying first) -- not something to flip silently here. -->
  <script src="/static/pages/exception-center.js?v={{ version }}"></script>
  <script src="/static/pages/production-trace.js?v={{ version }}"></script>
  <script src="/static/pages/qr-print.js?v={{ version }}"></script>
  <script src="/static/pages/system-logs.js?v={{ version }}"></script>
  <script src="/static/pages/material-flow.js?v={{ version }}"></script>
  <script src="/static/pages/text-guide.js?v={{ version }}"></script>
  <script src="/static/pages/employee-productivity.js?v={{ version }}"></script>
  <script>
    // Bootstrap only after all page renderers are loaded.
    const bootParams=new URLSearchParams(location.search);
    if(bootParams.get('guide')==='esp-kiosk'){
      setActive(document.querySelector('[data-page="tutorials"]'));
      renderEspKioskTutorial();
    }else{
      const initialPage=bootParams.get('page')||'overview';
      openPage(initialPage, document.querySelector(`[data-page="${initialPage}"]`));
      // Deep link support: a shared `?session=123` URL (or a page refresh
      // while the drawer was open) reopens the Session Detail drawer on top
      // of the default landing page. There is no recorded "previous
      // screen" for a cold load, so Back/Close on the drawer intentionally
      // falls back to staying on Overview instead of trying to guess one.
      const deepLinkSessionId=bootParams.get('session');
      if(deepLinkSessionId&&window.SessionDetailDrawer)window.SessionDetailDrawer.open(deepLinkSessionId);
    }
  </script>
</body>
</html>
