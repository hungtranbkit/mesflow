<body class="login-body" data-test-auto-login="{{ 1 if test_auto_login else 0 }}"><!-- THESIS: secure entry to a workshop control system, not a promotional sign-in. OWN-WORLD: command navy rail, white form surface, compact industrial typography. STORY: identify the system, authenticate, enter operations. FIRST VIEWPORT: product context at left, focused form at right. FORM: split operational gateway; seed mesflow-industrial-console. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. --><main class="login-shell"><section class="login-context" aria-label="Giới thiệu KIMEX"><div class="login-wordmark"><span>MF</span><b>KIMEX</b></div><div><h1>Điều hành sản xuất<br>rõ ràng tại xưởng.</h1><p>Theo dõi tiến độ, ngoại lệ và công việc cần xử lý trong một bàn điều độ thống nhất.</p></div><small>Industrial Operations Console · v{{ version }}</small></section><section class="login-card"><div class="login-heading"><span class="brand-mark">MF</span><div><h2>Đăng nhập</h2><p>Truy cập hệ thống KIMEX</p></div></div><form id="loginForm"><label>Tên đăng nhập<input id="username" autocomplete="username" required value="admin"></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Đăng nhập</button><div id="autoLoginStatus" class="auto-login-status" role="status"></div><div id="error" class="form-error" role="alert"></div></form></section></main><input type="hidden" id="nextUrl" value="{{ next_url }}">
<script src="/static/login.js?v={{ version }}"></script></body></html>
