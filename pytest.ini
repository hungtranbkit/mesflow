[pytest]
pythonpath = app
testpaths = tests
addopts = -ra
markers =
    postgres: requires the Docker PostgreSQL and running MESFlow API
    unit: pure calculation or isolated contract test without PostgreSQL
    behavior: state-transition/business behavior test through a real service boundary
    integration: HTTP/repository/PostgreSQL integration test
    static: source/package/deployment contract that is intentionally static
    slow: long-running soak or concurrency scenario
