name: mesflow-report-assistant
services:
  reports:
    image: ${REPORT_IMAGE:?Set immutable report image tag}
    container_name: mesflow-report-assistant
    env_file: /opt/mesflow/public-support.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m]
    volumes: [/opt/mesflow/report-audit:/audit]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    networks: [gateway]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  gateway:
    external: true
    name: mesflow-edge
