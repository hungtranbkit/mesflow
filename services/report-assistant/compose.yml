name: mesflow-report-assistant
services:
  reports:
    image: ${REPORT_IMAGE:?Set immutable report image tag}
    container_name: mesflow-report-assistant
    env_file: /opt/mesflow/public-support.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m]
    volumes: [/opt/mesflow/report-audit:/audit, /opt/mesflow/report-snapshots:/snapshots:ro]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    networks: [gateway]
    healthcheck:
      test: [CMD, python, -c, "from snapshot_store import load; load('/snapshots','reports.json',150); load('/snapshots','active.json',60)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  snapshots:
    image: ${SNAPSHOT_IMAGE:?Set immutable snapshot worker image tag}
    container_name: mesflow-report-snapshots
    env_file: /opt/mesflow/report-snapshots.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=8m]
    volumes: [/opt/mesflow/report-snapshots:/snapshots]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    networks: [database]
    healthcheck:
      test: [CMD, python, -c, "from snapshot_store import load; load('/snapshots','reports.json',150); load('/snapshots','active.json',60)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  gateway:
    external: true
    name: mesflow-edge
  database:
    external: true
    name: ${SNAPSHOT_DB_NETWORK:?Set verified TEST database network}
