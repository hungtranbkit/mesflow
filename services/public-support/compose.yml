name: mesflow-public-support
services:
  support:
    image: ${SUPPORT_IMAGE:?Set immutable support image tag}
    container_name: mesflow-public-support
    env_file: /opt/mesflow/public-support.env
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    networks: [gateway]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  gateway:
    external: true
    name: mesflow_network
