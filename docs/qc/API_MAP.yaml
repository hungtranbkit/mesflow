    - {method: POST, path: /api/users/<id>/reset-password, roles: "permission_required(users.manage)", surface: ui}
    - {method: GET,  path: /api/roles, roles: "permission_required(users.view)", surface: ui}
    - {method: PUT,  path: /api/roles/<role_code>/permissions, roles: "permission_required(roles.manage)", surface: ui}

