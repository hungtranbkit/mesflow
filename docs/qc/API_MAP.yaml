# API_MAP.yaml — endpoint -> feature -> roles -> surface. Extracted
# programmatically from every @bp.<method>/@app.<method> decorator across
# app/mesflow/web/*.py (183 routes total at audit time) and cross-checked
# against each route's own decorator stack.
#
# IMPORTANT caveat on the `roles` column: a route with no
# login_required/roles_required/permission_required/admin_required/
# super_admin_required DECORATOR is not necessarily unauthenticated — many
# such routes call `session_policy.validate_and_touch()` MANUALLY inside
# the function body instead (confirmed for GET /api/tutorials,
# GET /tutorials/<filename>, GET /app, GET /admin, GET /api/auth/me among
# others). `roles: none_decorator` below means exactly that — "no
# decorator found", NOT "confirmed unauthenticated". Only the entries
# explicitly marked `roles: public_confirmed` below were verified by
# reading the function body for an actual auth check (or its absence).
# Never assume `none_decorator` means public without checking the body.

surface_legend:
  ui: called from a render*() function in app/mesflow/web/static/{app.js,pages/*.js}
  api_only: no UI caller found in this pass (internal/integration/legacy use)
  device: Kiosk v1/v2 device-facing, not a user-role surface
  background: invoked by a cron job (see BACKGROUND_JOBS.yaml), not a
    direct user/UI call

by_feature:
  auth_login:
    - {method: POST, path: /api/auth/login, roles: public_confirmed
       (establishes the identity later checks run against), surface: ui}
    - {method: POST, path: /api/auth/logout, roles: public_confirmed
       (callable with or without a session), surface: ui}
    - {method: GET,  path: /api/auth/me, roles: public_confirmed
       (session-checked in body, returns 401 if none), surface: ui}
    - {method: POST, path: /api/auth/test-auto-login, roles: public_confirmed
       (guarded by MESFLOW_TEST_AUTO_LOGIN env, not by role), surface: ui}
    - {method: POST, path: /api/auth/change-password, roles: any_authenticated, surface: ui}
    - {method: GET,  path: /login, roles: public_confirmed, surface: ui}
    - {method: GET,  path: /app, roles: public_confirmed (session-checked
       in body, redirects to /login if invalid), surface: ui}
    - {method: GET,  path: "/admin, /admin/", roles: public_confirmed
       (session-checked in body; legacy alias for /app), surface: ui}

  rbac_admin:
