  - id: monitoring_admin
    name_vi: Monitoring (admin)
    surface: [ui, api]
    criticality: low
    application_map_pages: [monitoring]

count_summary:
  total_features: 38
  by_surface:
    ui_and_api: 25
    api_only: 11
    background_only: 2
  by_criticality: {critical: 9, high: 6, medium: 15, low: 8}
