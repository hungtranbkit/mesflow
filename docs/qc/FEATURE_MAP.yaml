# FEATURE_MAP.yaml — testable feature/behavior catalog. Every feature has
# a stable id (referenced by API_MAP.yaml, EXECUTOR_MAP.yaml,
# BUSINESS_RULES.yaml, and REQ blocks in MESFLOW_QC_EXECUTABLE_REQUIREMENTS.md).
# surface: ui | api | background | deterministic (a feature can list more
# than one). criticality: critical | high | medium | low (business impact
# of a regression, not a statement about test priority — see each REQ's
# own Priority field for that).

features:
  - id: auth_login
    name_vi: Xác thực & session
    surface: [ui, api]
    criticality: critical
    application_map_pages: [login]
    note: real password login, logout, session check, test-auto-login,
      persona quick-switch

  - id: rbac_admin
    name_vi: Người dùng & phân quyền
    surface: [ui, api]
    criticality: critical
    application_map_pages: [users]

  - id: dashboard_overview
    name_vi: Tổng quan sản xuất
    surface: [ui, api]
    criticality: high
    application_map_pages: [overview]

  - id: dashboard_daily
    name_vi: Dashboard theo ngày
    surface: [ui, api]
    criticality: high
    application_map_pages: [dashboard]

  - id: production_order
    name_vi: Production Order
    surface: [ui, api]
    criticality: critical
    application_map_pages: [production-orders]

  - id: template
    name_vi: Template / quy trình
    surface: [ui, api]
    criticality: critical
    application_map_pages: [templates]

  - id: part_operation_generic
    name_vi: Part & Operation (CRUD trực tiếp, ngoài luồng template)
    surface: [api]
    criticality: medium
    application_map_pages: []
    note: generic /api/parts, /api/operations resource CRUD (see
      resources{} in app.js); primary path is still template instantiate

  - id: employee
    name_vi: Nhân viên & QR
    surface: [ui, api]
    criticality: high
    application_map_pages: [employees, qr-print]

  - id: equipment
    name_vi: Thiết bị
    surface: [ui, api]
    criticality: medium
    application_map_pages: [equipment]

  - id: station_salesorder_generic
    name_vi: Trạm / Sales Order (generic resource, không có nav)
    surface: [api]
    criticality: low
    application_map_pages: [stations, sales-orders]

  - id: work_session_lifecycle
    name_vi: Vòng đời Phiên làm việc
    surface: [api]
    criticality: critical
    application_map_pages: [session-management]
    note: start/finish/batch-finish/adjust/edit/transfer-operation/
      exclude/restore — the atomic unit of production data

  - id: session_management_ui
    name_vi: Màn hình Quản lý Session
    surface: [ui]
    criticality: critical
    application_map_pages: [session-management]

  - id: kiosk_v1_browser
    name_vi: Kiosk v1 (trình duyệt)
    surface: [ui, api]
    criticality: high
    application_map_pages: ["/kiosk"]

  - id: kiosk_v2_device
    name_vi: Kiosk v2 (thiết bị ESP32)
    surface: [api]
    criticality: critical
    application_map_pages: []
    note: no browser UI; device-token auth, event-sourced projection —
      see STATE_MACHINES.yaml kiosk_v2_device

  - id: kiosk_management_ui
    name_vi: Quản lý trạm kiosk
    surface: [ui, api]
    criticality: high
    application_map_pages: [kiosk-management]

  - id: kiosk_wallboard
    name_vi: Kiosk wallboard năng suất nhân viên
    surface: [ui, api, deterministic]
    criticality: medium
    application_map_pages: ["/kiosk/employee-productivity"]
    note: unauthenticated by design; must never diverge from
      employee_productivity_report's numbers for the same range

  - id: employee_productivity_report
    name_vi: Báo cáo năng suất nhân viên
    surface: [ui, api, deterministic]
    criticality: critical
    application_map_pages: [employee-productivity]
    note: this is the REQUIRED "Năng suất nhân viên" tutorial chapter
      subject; formula in BUSINESS_RULES.yaml

  - id: exception_center
    name_vi: Trung tâm ngoại lệ
    surface: [ui, api, background]
    criticality: critical
    application_map_pages: [session-exceptions]
    note: primary exception system (exception_records) — see
      STATE_MACHINES.yaml; detection runs via exception_reconciliation job

  - id: session_exceptions_legacy
    name_vi: Session Exceptions (hệ cũ)
    surface: [ui, api]
    criticality: medium
    application_map_pages: [session-management]
    note: session_exception_reviews table, still live on Session
      Management, SEPARATE from exception_center — do not conflate codes

  - id: production_schedule
    name_vi: Gantt & Material Flow
    surface: [ui, api]
    criticality: medium
    application_map_pages: [production-schedule]

  - id: production_trace
