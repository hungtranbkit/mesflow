    criticality: medium
    application_map_pages: [production-trace]

  - id: business_audit
    name_vi: Nhật ký nghiệp vụ
    surface: [ui, api]
    criticality: medium
    application_map_pages: [business-audit]

  - id: working_calendar
    name_vi: Lịch làm việc / ca
    surface: [ui, api]
    criticality: high
    application_map_pages: [working-calendar]

  - id: shift_auto_close
    name_vi: Tự động đóng ca (auto-close)
    surface: [background]
    criticality: critical
    application_map_pages: []
    note: required tutorial error-scenario ("quên nhập sản lượng / vượt
      giờ ca"); see BACKGROUND_JOBS.yaml

  - id: exception_reconciliation
    name_vi: Job phát hiện ngoại lệ
    surface: [background]
    criticality: critical
    application_map_pages: []

  - id: log_retention
    name_vi: Job dọn log theo hạn lưu trữ
    surface: [background, api]
    criticality: low
    application_map_pages: []

  - id: system_logs_app
    name_vi: Nhật ký ứng dụng (action log / error trace, admin)
    surface: [ui, api]
    criticality: medium
    application_map_pages: [system-logs]
    note: gated by roles.manage (admin_required), narrower than
      manager's own logs.view-driven screen — see RBAC_MAP.yaml

  - id: system_console
    name_vi: System Console (Super Admin)
    surface: [ui, api]
    criticality: critical
    application_map_pages: [system-overview, system-errors,
      system-logs-it, system-services, system-diagnostics, system-audit]
    note: most security-sensitive RBAC boundary in the system — admin
      must 403 here despite admin's blanket bypass elsewhere

  - id: system_health_alerts
    name_vi: System Health — alert/chẩn đoán/dự đoán/kênh thông báo
    surface: [ui, api]
    criticality: medium
    application_map_pages: [system-overview, system-diagnostics]
    note: NOT documented at all in docs/MESFLOW_MASTER_REQUIREMENTS.md —
      newly catalogued in this audit (alert AI-analysis, per-alert
      diagnostics, notification-channel test, recurring-incidents,
      predictions, metric trend). Flagged in REQUIREMENT_CODE_GAPS.md.

  - id: tutorials
    name_vi: Hướng dẫn (video + văn bản)
    surface: [ui, api]
    criticality: medium
    application_map_pages: [tutorials]
    note: see reports/TUTORIAL_VIDEO_PIPELINE_RECOVERY_20260905.md for the
      2 real pipeline bugs found/fixed 2026-09-05 and the durable-mount
      fix pattern; 15-chapter consistency enforced by
      tests/test_tutorial_chapter_count_consistency.py

  - id: qr_print
    name_vi: Danh sách QR Code (in hàng loạt)
    surface: [ui, api]
    criticality: low
    application_map_pages: [qr-print]

  - id: import_export_excel
    name_vi: Import/Export Excel Template & Operation
    surface: [api]
    criticality: medium
    application_map_pages: [templates]
    note: entry point is a button inside the templates page; the
      validation rule set itself (§10 of the master doc) has no dedicated
      pytest file at audit time (SPEC-GAP-009, carried)

  - id: qc_inspection
    name_vi: QC Inspection
    surface: [api]
    criticality: medium
    application_map_pages: [qc]
    note: reachable page id exists (renderSimple) but no dedicated,
      richer UI found — primarily an API-level feature

  - id: notifications
    name_vi: Thông báo
    surface: [api]
    criticality: low
    application_map_pages: [notifications]

  - id: penalty_ticket
    name_vi: Phiếu phạt (penalty ticket)
    surface: [api]
    criticality: low
    application_map_pages: []
    note: POST /api/supervisor/penalties exists; no dedicated list/view
      page id found — API-only surface at audit time

  - id: esp_ota
    name_vi: ESP Kiosk OTA (firmware)
    surface: [ui, api]
    criticality: medium
    application_map_pages: [esp-ota]
    note: full permission family (ota.*, 9 distinct codes) despite no
      sidebar entry — reachable via direct link only

  - id: kpi_legacy_views
