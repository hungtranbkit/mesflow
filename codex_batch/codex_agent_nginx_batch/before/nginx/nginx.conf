worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 200m;
  proxy_connect_timeout 15s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  upstream mesflow_backend {
    server mesflow:8080;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name mesflow.net;

    location = /nginx-health {
      default_type text/plain;
      return 200 "nginx ok\n";
    }

    # ESP32 kiosk/device API may use plain HTTP. Keep browser/web traffic on HTTPS.
    location ^~ /api/kiosk/ {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_buffering off;
    }

    location ^~ /api/station/ {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_buffering off;
    }

    location = /api/lookup {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_buffering off;
    }

    location ^~ /api/session/group/ {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_buffering off;
    }

    location = /api/demo-codes {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_buffering off;
    }

    location / {
      return 301 https://mesflow.net$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesflow.net;

    ssl_certificate /etc/nginx/certs/mesflow.net.pem;
    ssl_certificate_key /etc/nginx/certs/mesflow.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    location = /nginx-health {
      default_type text/plain;
      return 200 "nginx ok\n";
    }

    location = /api/auth/login {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      proxy_pass http://mesflow_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      proxy_buffering off;
    }
  }
}
